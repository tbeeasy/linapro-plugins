# 插件唯一标识，必须在宿主和源码插件目录中保持唯一，并使用 `kebab-case` 命名风格。
id: linapro-moka-report-sync

# 插件显示名称，用于插件管理页面、开发文档和展示。
name: Moka 报表同步

# 插件语义化版本号，当前示例统一使用带 `v` 前缀的写法。
version: v0.1.0

# 插件类型枚举。可选值：`source` 表示随宿主源码编译交付；`dynamic` 表示作为运行时动态插件产物加载。
type: source

# 插件分发治理枚举。`managed` 表示本领域插件通过插件管理显式治理；它不是宿主关键 builtin，宿主启动不会自动安装。
distribution: managed

# 多租户作用域枚举。可选值：`platform_only` 表示仅平台上下文可见和治理；`tenant_aware` 表示按租户上下文治理。
# 本插件为报表同步编排，仅在平台层面运行。
scope_nature: platform_only

# 多租户支持标记。`true` 表示插件支持租户级安装、租户级启用与新租户开通策略治理。
supports_multi_tenant: false

# 默认安装模式枚举。可选值：`global` 表示全局统一安装启用；`tenant_scoped` 表示按租户独立启用或禁用。
# 本插件随宿主全局统一启用，不按租户独立启停；报表映射统一从平台级 sys_config 读取。
default_install_mode: global

# 插件说明，概述 Moka 报表同步的数据流向、写入策略与依赖。
description: |
  定时把 Moka 报表中心数据同步到飞书多维表格（Bitable）。
  - 通过 Moka getReportData 接口按 reportId 拉取报表
  - 工号主键 + 交集列完整性门闩写入 Bitable（新增 / 重写 / 冻结）
  依赖 linapro-moka-hcm 插件提供 Moka API 客户端能力。

# 插件作者或归属团队。
author: linapro

# 插件许可证标识。
license: Apache-2.0

# 插件国际化配置。该配置与宿主 i18n 配置结构保持一致；启用后需提供对应语言资源。
i18n:
  enabled: true
  default: zh-CN
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文
