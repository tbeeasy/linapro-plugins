# 插件唯一标识，必须在宿主和源码插件目录中保持唯一，并使用 `kebab-case` 命名风格。
id: linapro-monitor-apilog

# 插件显示名称，用于插件管理页面、开发文档和展示。
name: 系统监控-接口请求日志

# 插件语义化版本号，当前示例统一使用带 `v` 前缀的写法。
version: v0.1.0

# 插件类型枚举。可选值：`source` 表示随宿主源码编译交付；`dynamic` 表示作为运行时动态插件产物加载。
type: source

# 插件分发治理枚举。`managed`表示本插件通过插件管理或 `plugin.autoEnable` 显式治理；
# 它不是宿主关键 builtin，宿主启动不会自动安装。未安装时不影响任何业务插件。
distribution: managed

# 多租户作用域枚举。日志是平台级审计数据，调用方是员工或外部系统而非后台用户，
# 记录本身不属于任何租户，因此只按平台上下文治理。
scope_nature: platform_only

# 多租户支持标记。平台级审计插件，不做租户级安装治理。
supports_multi_tenant: false

# 默认安装模式枚举。可选值：`global` 表示全局统一安装启用；`tenant_scoped` 表示按租户独立启用或禁用。
default_install_mode: global

# 插件说明，概述插件的能力边界。
description: 自动记录非管理后台接口请求的完整请求与响应，支持按调用方与路径检索；记录只增不删。

# 插件作者或归属团队。
author: linapro

# 插件许可证标识。
license: Apache-2.0

# 后台菜单：系统监控 → 接口请求日志。
# 菜单与权限点由宿主在安装时同步进 sys_menu，不在 SQL 里 INSERT。
menus:
  - key: plugin:linapro-monitor-apilog:apilog
    parent_key: monitor
    name: 接口请求日志
    path: /monitor/apilog
    component: system/plugin/dynamic-page
    perms: monitor:apilog:list
    icon: lucide:radio-tower
    type: M
    sort: 5
    remark: 系统监控插件-接口请求日志
  # 按钮权限点：查看详情（含完整请求头、请求体与响应体）。
  - key: plugin:linapro-monitor-apilog:apilog:query
    parent_key: plugin:linapro-monitor-apilog:apilog
    name: 日志详情
    perms: monitor:apilog:query
    type: B
    sort: 1

# 插件国际化配置。该配置与宿主 i18n 配置结构保持一致；启用后需提供对应语言资源。
i18n:
  enabled: false
  default: zh-CN
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文
