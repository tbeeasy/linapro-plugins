# CLI 工具，仅用于开发环境。
# https://goframe.org/docs/cli
gfcli:
  gen:
    dao:
      - link: "pgsql:postgres:postgres@tcp(127.0.0.1:5432)/linapro?sslmode=disable"
        path: "internal"
        tables: "plugin_linapro_employee_core_employee,plugin_linapro_employee_core_employee_dept,plugin_linapro_employee_core_lark_identity"
        removePrefix: "plugin_linapro_employee_core_"
        importPrefix: "lina-plugin-linapro-employee-core/backend/internal"
        descriptionTag: true
        noModelComment: true
        stdTime: true
        typeMapping:
          timestamp:
            type: "*time.Time"
            import: time
          "timestamp without time zone":
            type: "*time.Time"
            import: time
          timestamptz:
            type: "*time.Time"
            import: time
          "timestamp with time zone":
            type: "*time.Time"
            import: time
