# 插件唯一标识，必须在宿主和源码插件目录中保持唯一，并使用 `kebab-case` 命名风格。
id: linapro-employee-core

# 插件显示名称，用于插件管理页面、开发文档和展示。
name: Employee Identity - Core

# 插件语义化版本号，当前示例统一使用带 `v` 前缀的写法。
version: v0.1.0

# 插件类型枚举。可选值：`source` 表示随宿主源码编译交付；`dynamic` 表示作为运行时动态插件产物加载。
type: source

# 插件分发治理枚举。`managed`表示本领域插件通过插件管理显式治理；它不是宿主关键
# builtin，宿主启动不会自动安装。未安装或禁用时员工身份/登录能力 fail-closed。
distribution: managed

# 多租户作用域枚举。员工身份按租户治理：每租户各自的 Lark App、员工与登录。
scope_nature: platform_only

# 多租户支持标记。`true` 表示插件支持租户级安装与开通治理。
supports_multi_tenant: false

# 默认安装模式枚举。可选值：`global` 表示全局统一安装启用；`tenant_scoped` 表示按租户独立启用或禁用。
default_install_mode: global

# 插件说明，概述插件的能力边界。
description: Provides Lark-authenticated employee identity, per-tenant login, and the EmpAuth session seam shared by attendance and survey plugins. Business data references the internal EmpID, not the Lark open_id.

# 插件作者或归属团队。
author: linapro

# 插件主页或文档地址，用于补充项目介绍、设计文档或外部说明链接。
homepage: https://example.com/lina/plugins/linapro-employee-core

# 插件许可证标识。
license: Apache-2.0

# 插件国际化配置。该配置与宿主 i18n 配置结构保持一致；启用后需提供对应语言资源。
i18n:
  enabled: false
  default: en-US
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文
